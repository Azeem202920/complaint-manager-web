name: complaint_manager
description: A Flutter complaint management system with Firebase
publish_to: 'none'
version: 1.0.2+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase packages
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  # State Management & Utilities
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  # UI & Utilities
  image_picker: ^1.0.4
  flutter_image_compress: ^2.3.0
  permission_handler: ^11.3.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  csv: ^6.0.0
  signature: ^5.5.0
  # Location packages
  google_maps_flutter: ^2.5.0
  geolocator: ^11.1.0
  # PDF Generation & Printing
  pdf: ^3.10.7
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true